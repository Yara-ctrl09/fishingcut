<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>의심스러운 로그인 페이지</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .box {
        background: white;
        padding: 32px;
        border-radius: 18px;
        width: min(440px, 90%);
        box-shadow: 0 20px 45px rgba(0,0,0,0.25);
        border-top: 6px solid #d9534f;
      }
      .badge {
        display: inline-block;
        background: #ffe2e2;
        color: #c53030;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: #666; line-height: 1.5; }
      input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
      button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: linear-gradient(135deg, #1f73d8, #3b82f6); color: white; font-weight: bold; cursor: pointer; }
      .warning {
        margin-top: 12px;
        color: #d9534f;
        font-size: 13px;
        font-weight: bold;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">⚠️ 의심스러운 페이지</div>
      <h1>계정 보안 확인</h1>
      <p>보안 업데이트가 필요합니다. 로그인 정보를 즉시 확인해 주세요.</p>
      <input type="text" placeholder="아이디" />
      <input type="password" placeholder="비밀번호" />
      <button>로그인</button>
      <div class="warning">주의: 이 페이지는 교육용 예시이며, 실제로 개인정보를 입력하지 마세요.</div>
    </div>
  </body>
</html>
